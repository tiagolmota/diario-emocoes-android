# gradle.properties
# Configurações globais do Gradle para o projecto Android.

# Aumenta a memória disponível para o processo Gradle (evita OutOfMemoryError em builds grandes)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Activar builds paralelas (melhora performance em projectos multi-módulo)
org.gradle.parallel=true

# Cache de configuração (Gradle 7+) — acelera builds repetidas
org.gradle.caching=true

# AndroidX: obrigatório para usar as bibliotecas Jetpack modernas (Room, Lifecycle, etc.)
android.useAndroidX=true

# Desactivar Jetifier (não há dependências legadas que precisem de migração para AndroidX)
android.enableJetifier=false
