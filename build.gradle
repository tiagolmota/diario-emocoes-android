// build.gradle (Project: diario-emocoes-android)
// ============================================================================
// Ficheiro de build raiz — define plugins disponíveis para todos os módulos.
// NÃO adicionar dependências aqui; vão no build.gradle do módulo app/.
// ============================================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        // Nota: sem classpath kotlin — projecto Java puro
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
