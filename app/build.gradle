// build.gradle (Module: app)
// ============================================================================
// DEPENDÊNCIAS DO PROJETO — VERSÃO JAVA
//
// Todas as versões aqui declaradas são as estáveis disponíveis em Maio 2026.
// Verificar atualizações em: https://developer.android.com/jetpack/androidx/releases
// ============================================================================

plugins {
    id 'com.android.application'
    // NOTA: Sem o plugin 'kotlin-android' — este é um projeto Java puro.
    // O plugin 'kotlin-kapt' também não é necessário;
    // usamos 'annotationProcessor' nativo do Java para o Room.
}

android {
    namespace 'pt.isla.diarioemocoes'
    compileSdk 34

    defaultConfig {
        applicationId "pt.isla.diarioemocoes"
        minSdk 24          // Android 7.0 — cobre ~95% dos dispositivos ativos
        targetSdk 34       // Android 14
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Java 8 é necessário para lambdas (usados no adapter e nos listeners)
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // -------------------------------------------------------------------------
    // ROOM: Biblioteca de Persistência Local
    // room-runtime: componentes de execução (RoomDatabase, Dao, Entity)
    // room-compiler: processador de anotações — gera o código SQL em compilação
    // NOTA JAVA: usa 'annotationProcessor' em vez de 'kapt' (que é Kotlin-only)
    // -------------------------------------------------------------------------
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // -------------------------------------------------------------------------
    // LIFECYCLE: ViewModel e LiveData
    // lifecycle-viewmodel: classe AndroidViewModel e ViewModelProvider
    // lifecycle-livedata: LiveData e MutableLiveData
    // lifecycle-common-java8: lambda support para LifecycleObserver
    // -------------------------------------------------------------------------
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // -------------------------------------------------------------------------
    // UI COMPONENTS
    // recyclerview: lista eficiente com reciclagem de vistas
    // cardview: contentor com elevação e cantos arredondados para os itens
    // constraintlayout: layout responsivo e plano
    // -------------------------------------------------------------------------
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // AppCompat: ActionBar e temas Material compatíveis com Android antigo
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Material Design Components: estilos dos botões e campos de texto
    implementation 'com.google.android.material:material:1.11.0'
}
