// build.gradle (Module: app)
// ============================================================================
// DEPENDÊNCIAS DO PROJECTO — VERSÃO JAVA PURA
// Todas as versões são estáveis verificadas em Maio 2026.
// ============================================================================

plugins {
    id 'com.android.application'
    // Sem 'kotlin-android' — projecto Java puro.
    // Sem 'kotlin-kapt' — usamos 'annotationProcessor' nativo para o Room.
}

android {
    namespace 'pt.isla.diarioemocoes'
    compileSdk 34

    defaultConfig {
        applicationId "pt.isla.diarioemocoes"
        minSdk 24          // Android 7.0 — cobre ~95% dos dispositivos activos
        targetSdk 34       // Android 14
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Java 8 obrigatório para lambdas (usados no adapter e listeners)
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    // -------------------------------------------------------------------------
    // ROOM: Persistência Local (ORM sobre SQLite)
    // room-runtime: componentes de execução
    // room-compiler: gera código SQL em tempo de compilação (annotationProcessor, não kapt)
    // -------------------------------------------------------------------------
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // -------------------------------------------------------------------------
    // LIFECYCLE: ViewModel e LiveData
    // -------------------------------------------------------------------------
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // -------------------------------------------------------------------------
    // UI COMPONENTS
    // -------------------------------------------------------------------------
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // -------------------------------------------------------------------------
    // TESTES
    // -------------------------------------------------------------------------
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
